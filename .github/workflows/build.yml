name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ToddsCardVault.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ToddsCardVault-${{ github.run_number }}
          path: ToddsCardVault.apk

      # Publishes the APK as a GitHub release so the phone can download it directly:
      # https://github.com/<owner>/card-vault/releases/latest
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ToddsCardVault.apk \
            --title "Todd's Card Vault (build ${{ github.run_number }})" \
            --notes "Download ToddsCardVault.apk on the phone and open it to install or update." \
            --latest
